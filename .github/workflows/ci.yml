name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — the older result is
# never the one anyone acts on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Shuffled deliberately. Tests that pass only in the order they happen to
      # run in have bitten this repo more than once — a cache test that relied
      # on a sibling having fetched first, module-level state one test wrote and
      # another asserted was pristine. Both looked like flakes and were order
      # bugs. Shuffling turns that class from intermittent into immediate.
      #
      # Every shuffled run prints its seed ("Running tests with seed ..."), so
      # a red run is reproducible exactly:
      #   npx vitest run --sequence.shuffle --sequence.seed=<seed>
      # `npm test` stays unshuffled, so local runs are reproducible by default.
      - name: Tests (shuffled)
        run: npm run test:ci

      # No Supabase env is set on purpose: the app degrades gracefully without
      # it, and the build is the check that it still does.
      - name: Build
        run: npm run build
